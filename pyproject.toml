[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-pipeline"
version = "0.1.0"
description = "Local-first OCR document processing pipeline"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "zxing-cpp>=2.2",
]

[project.optional-dependencies]
vertex = ["google-genai>=1.0"]
gemini = ["google-genai>=1.0"]
openai = ["openai>=1.66,<3"]
claude = ["anthropic>=0.40,<1"]
spellcheck = [
    "pyspellchecker>=0.8.2,<1",
    "opencc-python-reimplemented>=0.1.7,<1",
]
layout = [
    "paddleocr>=3.7.0,<4",
    "paddlepaddle>=3.3.1,<4",
    "paddlex[ocr]>=3.7.0,<3.8.0",
]
tesseract = ["pytesseract>=0.3.13,<1"]

[project.scripts]
ocr-pipeline = "ocr_pipeline.cli:main"

[project.entry-points."ocr_pipeline.ocr_adapters"]
tesseract = "ocr_pipeline.adapters.tesseract_ocr:TesseractOCRAdapter"
vietocr = "ocr_pipeline.adapters.vietocr_layout:VietOCRLayoutAdapter"
gemini = "ocr_pipeline.adapters.gemini_ocr:GeminiOCRAdapter"
openai = "ocr_pipeline.adapters.openai_ocr:OpenAIOCRAdapter"
claude = "ocr_pipeline.adapters.claude_ocr:ClaudeOCRAdapter"

[tool.setuptools.packages.find]
include = ["ocr_pipeline*"]
